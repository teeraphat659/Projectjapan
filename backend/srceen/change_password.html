<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เปลี่ยนรหัสผ่าน</title>
  
  <link rel="stylesheet" href="/projectjapan/backend/styel/navbarbackend.css">
  <link rel="stylesheet" href="/projectjapan/backend/styel/style.css">
  
  <style>
    .password-card {
      max-width: 620px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
    }

    .field {
      margin: 16px 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    .submit {
      background: #111827;
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .message {
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="password-card">
      <h2>เปลี่ยนรหัสผ่าน</h2>
      <p class="message" id="message"></p>

      <form id="passwordForm">
        <div class="field">
          <label for="currentPassword">รหัสผ่านปัจจุบัน</label>
          <input id="currentPassword" type="password" required>
        </div>

        <div class="field">
          <label for="newPassword">รหัสผ่านใหม่</label>
          <input id="newPassword" type="password" required minlength="8">
        </div>

        <div class="field">
          <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
          <input id="confirmPassword" type="password" required minlength="8">
        </div>

        <button class="submit">เปลี่ยนรหัสผ่าน</button>
      </form>
    </div>
  </main>

  <script src="/projectjapan/backend/script.js"></script>
  <script>
    const endpoint = '/projectjapan/backend/php/action/admin_api.php';
    const message = document.getElementById('message');

    document.getElementById('passwordForm').addEventListener('submit', (e) => {
      e.preventDefault();

      if (newPassword.value !== confirmPassword.value) {
        message.textContent = 'ยืนยันรหัสผ่านใหม่ไม่ตรงกัน';
        return;
      }

      fetch(endpoint, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'password_update',
          current_password: currentPassword.value,
          new_password: newPassword.value
        })
      })
      .then((r) => r.json())
      .then((r) => {
        message.textContent = r.message;
        if (r.success) {
          e.target.reset();
        }
      })
      .catch(() => {
        message.textContent = 'เปลี่ยนรหัสผ่านไม่สำเร็จ';
      });
    });
  </script>
</body>
</html>
