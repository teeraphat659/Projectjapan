<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข้อมูลส่วนตัว</title><link rel="stylesheet" href="/projectjapan/backend/styel/navbarbackend.css"><link rel="stylesheet" href="/projectjapan/backend/styel/style.css"><style>.profile-card{max-width:620px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px}.field{margin:16px 0}.field label{display:block;margin-bottom:6px;font-weight:600}.field input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px}.submit{background:#111827;color:#fff;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}.message{margin:12px 0}</style></head><body><div id="navbar-container"></div><main class="main-content"><div class="profile-card"><h2>ข้อมูลส่วนตัว</h2><p>แก้ไขข้อมูลบัญชีผู้ดูแลระบบ</p><p class="message" id="message"></p><form id="profileForm"><div class="field"><label for="firstname">ชื่อ</label><input id="firstname" required maxlength="100"></div><div class="field"><label for="lastname">นามสกุล</label><input id="lastname" required maxlength="100"></div><div class="field"><label for="email">อีเมล</label><input id="email" type="email" required maxlength="255"></div><button class="submit">บันทึกข้อมูล</button></form></div></main><script src="/projectjapan/backend/script.js"></script><script>const endpoint='/projectjapan/backend/php/action/admin_api.php',message=document.getElementById('message');fetch(endpoint+'?action=profile_get',{credentials:'same-origin'}).then(r=>r.json()).then(r=>{if(!r.success)throw Error(r.message);for(const key of ['firstname','lastname','email'])document.getElementById(key).value=r.item[key]||'';}).catch(e=>message.textContent=e.message||'โหลดข้อมูลไม่สำเร็จ');document.getElementById('profileForm').addEventListener('submit',e=>{e.preventDefault();fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'profile_update',firstname:firstname.value,lastname:lastname.value,email:email.value})}).then(r=>r.json()).then(r=>{message.textContent=r.message;if(!r.success)throw Error(r.message);}).catch(e=>message.textContent=e.message||'บันทึกข้อมูลไม่สำเร็จ');});</script></body></html>
