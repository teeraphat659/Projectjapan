<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการเฉลยเส้นตัวอักษร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/projectjapan/backend/styel/navbarbackend.css">
  <link rel="stylesheet" href="/projectjapan/backend/styel/style.css">
  <style>
    .reference-manage { max-width: 1100px; margin: 0 auto; }
    .manage-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
    .manage-heading h1 { margin:0 0 6px; color:#111827; font-size:25px; }
    .manage-heading p { margin:0; color:#6b7280; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .toolbar select { min-width:220px; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font:inherit; }
    .group-section { background:#fff; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:18px; overflow:hidden; }
    .group-heading { padding:14px 18px; background:#f8fafc; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; }
    .group-heading h2 { margin:0; font-size:18px; color:#1f2937; }
    .character-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:16px; }
    .character-item { border:1px solid #e5e7eb; border-radius:9px; padding:12px; display:flex; align-items:center; gap:10px; color:#374151; text-decoration:none; background:#fff; }
    .character-item:hover { border-color:#2563eb; box-shadow:0 3px 9px rgba(37,99,235,.12); }
    .character-symbol { font-size:30px; line-height:1; color:#111827; min-width:38px; text-align:center; }
    .character-info { min-width:0; display:grid; gap:3px; }
    .character-info strong { font-size:14px; }
    .character-info small { color:#6b7280; }
    .status { font-size:11px; font-weight:600; }
    .status.ready { color:#15803d; } .status.missing { color:#b45309; }
    .summary { color:#6b7280; font-size:14px; margin-bottom:14px; }
    .btn-add { color:#fff; background:#2563eb; padding:10px 14px; border-radius:8px; text-decoration:none; font-weight:600; white-space:nowrap; }
    @media(max-width:640px){.manage-heading{flex-direction:column}.character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="main-content"><div class="reference-manage">
    <div class="manage-heading"><div><h1><i class="fa-solid fa-table-list"></i> จัดการเฉลยเส้นตัวอักษร</h1><p>ดูตัวอักษรแยกตามวรรค และตรวจว่ามีเฉลยสำหรับระบบวิเคราะห์แล้วหรือยัง</p></div><a class="btn-add" href="/projectjapan/backend/php/srceen/writing_svg_reference.php"><i class="fa-solid fa-plus"></i> เพิ่มเฉลย</a></div>
    <div class="toolbar"><select id="type"><option value="">ทุกประเภท</option><option value="katakana">Katakana</option><option value="hiragana">Hiragana</option></select></div>
    <div id="summary" class="summary">กำลังโหลดข้อมูล...</div><div id="list"></div>
  </div></main>
  <script src="/projectjapan/backend/script.js"></script>
  <script>
    const api = '/projectjapan/backend/php/action/writing_svg_reference_api.php';
    const list = document.getElementById('list');
    const summary = document.getElementById('summary');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    async function load() {
      const result = await fetch(`${api}?action=list&type=${encodeURIComponent(document.getElementById('type').value)}`, { credentials:'same-origin' }).then((response) => response.json());
      if (!result.success) throw new Error(result.message || 'โหลดข้อมูลไม่สำเร็จ');
      const groups = new Map();
      (result.items || []).forEach((item) => { const key = item.char_group || 'other'; if (!groups.has(key)) groups.set(key, { name:item.group_name_th || `วรรค ${key}`, items:[] }); groups.get(key).items.push(item); });
      const items = result.items || []; const ready = items.filter((item) => Number(item.variant_count || 0) > 0).length;
      summary.textContent = `ตัวอักษร ${items.length} รายการ | มีเฉลยแล้ว ${ready} รายการ | ยังไม่มี ${items.length - ready} รายการ`;
      list.innerHTML = [...groups.values()].map((group) => `<section class="group-section"><div class="group-heading"><h2>วรรค ${escapeHtml(group.name)}</h2><span>${group.items.length} ตัวอักษร</span></div><div class="character-grid">${group.items.map((item) => { const variantCount = Number(item.variant_count || 0); return `<a class="character-item" href="/projectjapan/backend/php/srceen/writing_svg_reference.php?character_id=${Number(item.id)}"><span class="character-symbol">${escapeHtml(item.japanese_char)}</span><span class="character-info"><strong>${escapeHtml(item.romaji || '-')}</strong><small>${Number(item.stroke_count || 0)} เส้น</small><span class="status ${variantCount ? 'ready' : 'missing'}">${variantCount ? `<i class="fa-solid fa-circle-check"></i> มีเฉลย ${variantCount} กรณี` : '<i class="fa-solid fa-circle-exclamation"></i> ยังไม่มีเฉลย'}</span></span></a>`; }).join('')}</div></section>`).join('') || '<div class="group-section" style="padding:20px">ไม่พบข้อมูลตัวอักษร</div>';
    }
    document.getElementById('type').addEventListener('change', () => load().catch((error) => { summary.textContent = error.message; }));
    load().catch((error) => { summary.textContent = error.message; });
  </script>
</body>
</html>
