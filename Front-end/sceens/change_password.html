<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่าน - JP Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style/user.css">
    <link rel="stylesheet" href="../style/member-ui.css?v=member-nav-7">
    <style>
        .member-change-page {
            padding: 42px 0 72px;
        }
        .member-change-shell {
            width: min(760px, calc(100% - 40px));
            margin: 0 auto;
        }
        .member-change-card {
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.12);
        }
        .member-change-card h1 {
            margin: 0 0 8px;
            color: #111827;
            font-size: clamp(2rem, 4vw, 2.5rem);
            letter-spacing: -0.04em;
        }
        .member-change-card p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.7;
        }
        .member-change-form {
            display: grid;
            gap: 18px;
        }
        .member-field {
            display: grid;
            gap: 8px;
        }
        .member-field label {
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }
        .member-field input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #dfe7f1;
            border-radius: 12px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
        }
        .member-field input:focus {
            outline: 2px solid rgba(232, 93, 74, 0.18);
            border-color: rgba(232, 93, 74, 0.45);
            background: #fff;
        }
        .member-form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .member-submit-btn,
        .member-cancel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .member-submit-btn {
            background: linear-gradient(135deg, #e85d4a 0%, #d94632 100%);
            color: #fff;
        }
        .member-cancel-btn {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }
        .member-alert {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .member-alert.success {
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .member-alert.error {
            background: rgba(239, 68, 68, 0.08);
            color: #b91c1c;
            border: 1px solid rgba(239, 68, 68, 0.18);
        }
    </style>
</head>
<body class="member-page">
    <div data-member-navbar></div>
    <main class="member-change-page">
        <div class="member-change-shell">
            <div class="member-change-card">
                <h1>เปลี่ยนรหัสผ่าน</h1>
                <p>กรอกรหัสผ่านปัจจุบันและรหัสผ่านใหม่เพื่ออัปเดตความปลอดภัยของบัญชีของคุณ</p>

                {{statusMessage}}

                <form class="member-change-form" method="POST" action="../data/change_password.php">
                    <input type="hidden" name="csrf_token" value="{{csrfToken}}">
                    <div class="member-field">
                        <label for="current_password">รหัสผ่านปัจจุบัน</label>
                        <input id="current_password" name="current_password" type="password" required autocomplete="current-password" placeholder="กรอกรหัสผ่านปัจจุบัน">
                    </div>
                    <div class="member-field">
                        <label for="new_password">รหัสผ่านใหม่</label>
                        <input id="new_password" name="new_password" type="password" required minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร">
                    </div>
                    <div class="member-field">
                        <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
                        <input id="confirm_password" name="confirm_password" type="password" required minlength="8" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
                    </div>

                    <div class="member-form-actions">
                        <button class="member-submit-btn" type="submit"><i class="fa-solid fa-floppy-disk"></i> บันทึกรหัสผ่าน</button>
                        <a class="member-cancel-btn" href="../data/profile.php">ยกเลิก</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="../sceens/member-navbar.js?v=member-nav-7"></script>
</body>
</html>
