<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลืมรหัสผ่าน - JP Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style/navbar2.css">
<link rel="stylesheet" href="../style/public-auth.css">
<link rel="stylesheet" href="../style/password-recovery.css">
</head>
<body class="auth-page recovery-page">
<div data-navbar></div>
<main class="recovery-main">
    <section class="recovery-card" aria-labelledby="recoveryTitle">
        <div class="recovery-mark" aria-hidden="true">鍵</div>
        <p class="recovery-kicker">ACCOUNT RECOVERY</p>
        <h1 id="recoveryTitle">ลืมรหัสผ่าน?</h1>
        <p class="recovery-intro">กรอกอีเมลที่ใช้สมัครสมาชิก เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้คุณ</p>
        <div class="recovery-alert" id="recoveryAlert" role="status"></div>
        <form class="recovery-form" action="../connectapi/request_password_reset.php" method="POST">
            <label for="email">อีเมล</label>
            <input id="email" name="email" type="email" placeholder="example@email.com" required autocomplete="email" spellcheck="false">
            <button type="submit"><span>ส่งลิงก์ตั้งรหัสผ่านใหม่</span><span aria-hidden="true">→</span></button>
        </form>
        <a class="back-link" href="login.html">← กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
</main>
<footer class="public-footer auth-footer">JP Notes <span>·</span> เรียนรู้ตัวอักษรทีละตัว</footer>
<script src="public-navbar.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('recoveryAlert');
    if (params.get('sent') === '1') {
        alertBox.textContent = 'หากอีเมลนี้มีบัญชีอยู่ คุณจะได้รับลิงก์ภายในไม่กี่นาที กรุณาตรวจสอบโฟลเดอร์สแปมด้วย';
        alertBox.className = 'recovery-alert success';
    } else if (params.get('error')) {
        alertBox.textContent = params.get('error');
        alertBox.className = 'recovery-alert error';
    }
</script>
</body>
</html>
