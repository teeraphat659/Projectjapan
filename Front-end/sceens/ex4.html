<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฝึกเขียนตัวอักษรญี่ปุ่น</title>

    <link rel="stylesheet" href="../style/style7.css">

<body class="member-page member-practice-setup">

    <div data-member-navbar></div>

            <div class="input-box">

                    <option>คาตาคานะ (Katakana)</option>

                </select>
                <i class="fa-solid fa-list"></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="ชื่อ">
                <i class="fa-solid fa-note-sticky"></i>
            </div>

            <button class="start-btn">
                เริ่ม
            </button>

        </div>

    </div>

    <script src="../sceens/member-navbar.js"></script>
