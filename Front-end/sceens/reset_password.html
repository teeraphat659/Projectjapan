<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ - JP Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style/navbar2.css">
<link rel="stylesheet" href="../style/public-auth.css">
<link rel="stylesheet" href="../style/password-recovery.css">
</head>
<body class="auth-page recovery-page">
<div data-navbar></div>
<main class="recovery-main">
    <section class="recovery-card" aria-labelledby="resetTitle">
        <div class="recovery-mark" aria-hidden="true">新</div>
        <p class="recovery-kicker">NEW CREDENTIALS</p>
        <h1 id="resetTitle">ตั้งรหัสผ่านใหม่</h1>
        <p class="recovery-intro">สร้างรหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร เพื่อกลับไปเรียนต่อได้อย่างปลอดภัย</p>
        <div class="recovery-alert" id="resetAlert" role="alert"></div>
        <form class="recovery-form" id="resetForm" action="../connectapi/reset_password.php" method="POST">
            <input type="hidden" id="token" name="token">
            <label for="password">รหัสผ่านใหม่</label>
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร">
            <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
            <button type="submit"><span>บันทึกรหัสผ่านใหม่</span><span aria-hidden="true">→</span></button>
        </form>
        <a class="back-link" href="login.html">← กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
</main>
<footer class="public-footer auth-footer">JP Notes <span>·</span> เรียนรู้ตัวอักษรทีละตัว</footer>
<script src="public-navbar.js"></script>
<script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const tokenInput = document.getElementById('token');
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('resetAlert');
    tokenInput.value = token;
    if (!token) {
        alertBox.textContent = 'ลิงก์นี้ไม่ถูกต้องหรือไม่มีโทเคนรีเซ็ต';
        alertBox.className = 'recovery-alert error';
        form.hidden = true;
    } else {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (params.get('success') === '1') {
            alertBox.textContent = 'ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว คุณสามารถเข้าสู่ระบบได้ทันที';
            alertBox.className = 'recovery-alert success';
            form.hidden = true;
        } else if (error) {
            alertBox.textContent = error;
            alertBox.className = 'recovery-alert error';
        }
    }
</script>
</body>
</html>
